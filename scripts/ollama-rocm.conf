# Ollama on an AMD Radeon RX 6000 GPU (gfx103x) through ROCm.
# Install:  sudo mkdir -p /etc/systemd/system/ollama.service.d
#           sudo cp scripts/ollama-rocm.conf /etc/systemd/system/ollama.service.d/rocm.conf
#           sudo systemctl daemon-reload && sudo systemctl restart ollama
# Check:    ollama run llama3.2:3b "hi" && ollama ps      → PROCESSOR "100% GPU"
[Service]
# gfx1031/1032/1034/1035 are not on ROCm's list; their ISA matches gfx1030.
Environment="HSA_OVERRIDE_GFX_VERSION=10.3.0"
# Only the discrete GPU (HIP device 0 = RX 6700 XT); the APU's Radeon 680M would break kernels.
Environment="HIP_VISIBLE_DEVICES=0"
