name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install ruff==0.17.0 && ruff check .

  tests:
    # qasync does not run tasks on Python 3.14 (see README) — the app targets 3.10–3.13.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13", cache: pip, cache-dependency-path: requirements*.txt}
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3
      - run: pip install -r requirements-dev.txt
      - name: pytest (keyring uses an in-memory backend in CI)
        env:
          PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
        run: python -m pytest -c tests/pytest.ini --rootdir=. -q -p no:cacheprovider tests
