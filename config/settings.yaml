app:
  name: Cybrix AI
  version: 0.1.0
default_model: accounts/fireworks/models/qwen2p5-coder-32b-instruct
ai_providers:
  fireworks:
    enabled: true
    model: accounts/fireworks/models/qwen2p5-coder-32b-instruct
    api_key_env: FIREWORKS_API_KEY
  ollama:
    enabled: true
    model: llama3
    host: http://localhost:11434
ui:
  theme: dark
  language: en
logging:
  level: INFO
  file: cybrix.log
gpu:
  prefer_rocm: true
  fallback_to_cpu: true
backend:
  base_url: http://127.0.0.1:8000   # override with CYBRIX_SERVER_URL
  verify_tls: true
  heartbeat_interval: 25
  reconnect_max_delay: 60
  accept_remote_commands: true
  command_allowed_dirs: []          # dirs where server-issued log/malware commands may read files
  command_policy: ask               # ask | allow_listed | deny_all
  approval_timeout: 60              # seconds before an unanswered approval dialog denies the command
  share_telemetry: true             # stream CPU/RAM/disk/network metrics to the server
  telemetry_interval: 5
  token_refresh_days: 7
  allow_insecure: false             # never send the device token over plain http to a remote host
  data_dir: ~/.cybrix               # override with CYBRIX_DATA_DIR
database_url: sqlite:///cybrix.db
plugins_dir: plugins
diagnostics:
  sentry_dsn: ""                    # set by the release build; used only if the user opts in
updates:
  channel: stable                   # stable | beta (user can change it in Settings)
  public_key: ""                    # Ed25519 key that signs release manifests (set by the release build)
